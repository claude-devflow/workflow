# Claude駆動開発フローの共通ワークフロー。
# 各アプリの呼び出し用ファイルから workflow_call で呼ばれる。
# どのイベントに反応するかは route ジョブ（scripts/route.sh）が判定する。
name: devflow

on:
  workflow_call:
    inputs:
      devflow_ref:
        description: スクリプトとプロンプトを取得するref。呼び出し側の uses と同じタグ・ブランチを指定する
        type: string
        default: v1
      devflow_repo:
        description: 共通ワークフローのリポジトリ
        type: string
        default: claude-devflow/workflow
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
      DEVFLOW_ISSUE_TOKEN:
        description: 共通ワークフローのリポジトリへ改善Issueを立てるためのfine-grained PAT
        required: false

jobs:
  # イベントを判定する。Claudeは起動しない
  route:
    # botのコメント・レビュー、GITHUB_TOKENによるイベント、claude/ 以外のブランチのCI完了はここで落とす
    # （スキップしたジョブは実行時間を消費しない）
    if: >-
      github.event.sender.login != 'github-actions[bot]' &&
      !(contains(fromJSON('["issue_comment","pull_request_review"]'), github.event_name) && github.event.sender.type == 'Bot') &&
      (github.event_name != 'workflow_run' || startsWith(github.event.workflow_run.head_branch, 'claude/'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
      pull-requests: write
      actions: write
    outputs:
      config: ${{ steps.route.outputs.config }}
      mention: ${{ steps.route.outputs.mention }}
      reviewers: ${{ steps.route.outputs.reviewers }}
      issue_action: ${{ steps.route.outputs.issue_action }}
      issues: ${{ steps.route.outputs.issues }}
      pr_action: ${{ steps.route.outputs.pr_action }}
      prs: ${{ steps.route.outputs.prs }}
      flaky_run: ${{ steps.route.outputs.flaky_run }}
      run_id: ${{ steps.route.outputs.run_id }}
      comment_id: ${{ steps.route.outputs.comment_id }}
      review_id: ${{ steps.route.outputs.review_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.devflow_repo }}
          ref: ${{ inputs.devflow_ref }}
          sparse-checkout: scripts
          persist-credentials: false
      - id: route
        run: bash scripts/route.sh
        env:
          GH_TOKEN: ${{ github.token }}

  # Issue上の作業：モデルの判定（opus）、計画、実装
  issue:
    needs: route
    if: needs.route.outputs.issue_action != ''
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        issue: ${{ fromJSON(needs.route.outputs.issues) }}
    concurrency:
      group: devflow-issue-${{ matrix.issue }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: read
      id-token: write
    env:
      CFG: ${{ needs.route.outputs.config }}
      MENTION: ${{ needs.route.outputs.mention }}
      ISSUE: ${{ matrix.issue }}
      COMMENT_ID: ${{ needs.route.outputs.comment_id }}
      DEVFLOW_REPO: ${{ inputs.devflow_repo }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ fromJSON(needs.route.outputs.config).default_branch }}
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.devflow_repo }}
          ref: ${{ inputs.devflow_ref }}
          path: .devflow-src
          persist-credentials: false
      - name: 共通ワークフローの準備
        run: |
          mv .devflow-src "$RUNNER_TEMP/devflow"
          bash "$RUNNER_TEMP/devflow/scripts/env.sh"

      # モデルの判定：models.plan / models.implement が auto のとき、OpusがIssueだけを読んで決める
      - name: 判定のプロンプト
        id: triage_prompt
        if: needs.route.outputs.issue_action == 'plan' && (fromJSON(needs.route.outputs.config).models.plan == 'auto' || fromJSON(needs.route.outputs.config).models.implement == 'auto')
        run: |
          gh issue view "$ISSUE" --comments | head -c 30000 > "$RUNNER_TEMP/issue.md"
          ISSUE_DUMP="$RUNNER_TEMP/issue.md" bash "$DEVFLOW_DIR/scripts/prompt.sh" triage
      - name: モデルの判定
        id: triage
        if: steps.triage_prompt.outcome == 'success'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: claude
          prompt: ${{ steps.triage_prompt.outputs.text }}
          claude_args: >-
            ${{ env.ARGS_TRIAGE }}
            --json-schema '{"type":"object","properties":{"plan_model":{"type":"string","enum":["best","opus","sonnet","haiku"]},"implement_model":{"type":"string","enum":["best","opus","sonnet","haiku"]},"reason":{"type":"string"}},"required":["plan_model","implement_model","reason"]}'
      - name: モデルの決定
        id: models
        env:
          TRIAGE: ${{ steps.triage.outputs.structured_output }}
        run: |
          valid() { case $1 in best|opus|sonnet|haiku) echo "$1" ;; *) echo "$2" ;; esac; }
          triage=${TRIAGE:-}
          if [ -z "$triage" ]; then triage="{}"; fi
          plan=$(jq -r .models.plan <<<"$CFG")
          impl=$(jq -r .models.implement <<<"$CFG")
          if [ "$plan" = auto ]; then plan=$(valid "$(jq -r '.plan_model // ""' <<<"$triage")" best); fi
          if [ "$impl" = auto ]; then
            if [ -n "${TRIAGE:-}" ]; then
              impl=$(jq -r '.implement_model // ""' <<<"$triage")
              # best で実装するのは、計画も best のときだけ
              if [ "$impl" = best ] && [ "$plan" != best ]; then impl=opus; fi
            else
              # [LGTM] で実装するときは、最後の計画で決めたモデルを使う
              impl=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$ISSUE/comments" \
                --jq '.[] | select(.user.login == "github-actions[bot]") | .body' |
                grep -oE '<!-- devflow:model implement=[a-z]+ -->' | tail -n1 | sed -E 's/.*=([a-z]+) .*/\1/' || true)
            fi
            # 判定で選んだ実装のモデルは models.implement_max までに抑える
            rank() { case $1 in haiku) echo 1 ;; sonnet) echo 2 ;; opus) echo 3 ;; best) echo 4 ;; *) echo 0 ;; esac; }
            max=$(valid "$(jq -r '.models.implement_max // ""' <<<"$CFG")" opus)
            impl=$(valid "$impl" sonnet)
            if [ "$(rank "$impl")" -gt "$(rank "$max")" ]; then impl=$max; fi
          fi
          {
            echo "plan=$plan"
            echo "implement=$impl"
            echo "reason=$(jq -r '.reason // ""' <<<"$triage" | tr '\n' ' ')"
          } >> "$GITHUB_OUTPUT"

      - name: 計画のプロンプト
        id: plan_prompt
        if: needs.route.outputs.issue_action == 'plan'
        env:
          PLAN_MODEL: ${{ steps.models.outputs.plan }}
        run: bash "$DEVFLOW_DIR/scripts/prompt.sh" plan
      - name: 計画
        id: plan
        if: needs.route.outputs.issue_action == 'plan'
        uses: anthropics/claude-code-action@v1
        env:
          DEVFLOW_ISSUE_TOKEN: ${{ secrets.DEVFLOW_ISSUE_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: claude
          prompt: ${{ steps.plan_prompt.outputs.text }}
          claude_args: >-
            --model ${{ steps.models.outputs.plan }}
            ${{ env.ARGS_PLAN_BASE }}
            --json-schema '{"type":"object","properties":{"decision":{"type":"string","enum":["implement","wait","stop"${{ contains(fromJSON('["haiku","sonnet"]'), steps.models.outputs.plan) && ',"escalate"' || '' }}]},"comment":{"type":"string"}},"required":["decision","comment"]}'
      # 軽いモデルが難しいと判断したら、Opusで計画をやり直す
      - name: 計画のやり直しのプロンプト
        id: replan_prompt
        if: steps.plan.outcome == 'success' && fromJSON(steps.plan.outputs.structured_output).decision == 'escalate'
        env:
          PLAN_MODEL: opus
        run: bash "$DEVFLOW_DIR/scripts/prompt.sh" plan
      - name: 計画のやり直し
        id: replan
        if: steps.replan_prompt.outcome == 'success'
        uses: anthropics/claude-code-action@v1
        env:
          DEVFLOW_ISSUE_TOKEN: ${{ secrets.DEVFLOW_ISSUE_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: claude
          prompt: ${{ steps.replan_prompt.outputs.text }}
          claude_args: >-
            --model opus
            ${{ env.ARGS_PLAN_BASE }}
            --json-schema '{"type":"object","properties":{"decision":{"type":"string","enum":["implement","wait","stop"]},"comment":{"type":"string"}},"required":["decision","comment"]}'
      - name: 計画を投稿
        id: decision
        if: needs.route.outputs.issue_action == 'plan'
        env:
          RESULT: ${{ steps.replan.outputs.structured_output || steps.plan.outputs.structured_output }}
          ESCALATED: ${{ steps.replan.outcome == 'success' }}
          PLAN_MODEL: ${{ steps.replan.outcome == 'success' && 'opus' || steps.models.outputs.plan }}
          IMPL_MODEL: ${{ steps.models.outputs.implement }}
          IMPL_CFG: ${{ fromJSON(needs.route.outputs.config).models.implement }}
          REASON: ${{ steps.models.outputs.reason }}
        run: |
          decision=$(jq -r .decision <<<"$RESULT")
          impl=$IMPL_MODEL
          if [ "$ESCALATED" = true ]; then
            # やり直したものは、実装も sonnet 以上にする（判定で選んだときだけ）
            if [ "$IMPL_CFG" = auto ] && [ "$impl" = haiku ]; then impl=sonnet; fi
            REASON="${REASON:+$REASON }計画は難しいと判断され、Opusでやり直した。"
          fi
          note="<sub>モデル：計画 \`$PLAN_MODEL\` / 実装 \`$impl\`${REASON:+（$REASON）}</sub>"
          jq -r --arg note "$note" --arg impl "$impl" \
            '.comment + "\n\n" + $note + "\n\n<!-- devflow:plan -->\n<!-- devflow:model implement=" + $impl + " -->"' \
            <<<"$RESULT" > "$RUNNER_TEMP/plan.md"
          gh issue comment "$ISSUE" --body-file "$RUNNER_TEMP/plan.md"
          {
            echo "decision=$decision"
            echo "implement=$impl"
          } >> "$GITHUB_OUTPUT"

      - name: 実装済みか確認
        id: guard
        if: needs.route.outputs.issue_action == 'implement' || steps.decision.outputs.decision == 'implement'
        run: |
          pr=$(gh pr list --state all --limit 100 --json number,headRefName,state \
            --jq ".[] | select(.state != \"CLOSED\" and (.headRefName | startswith(\"claude/issue-$ISSUE-\"))) | .number" | head -n1)
          if [ -n "$pr" ]; then
            echo "#$ISSUE にはPR #$pr があるため実装しない"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - name: 実装のプロンプト
        id: impl_prompt
        if: steps.guard.outputs.go == 'true'
        run: bash "$DEVFLOW_DIR/scripts/prompt.sh" implement
      - name: 実装
        if: steps.guard.outputs.go == 'true'
        uses: anthropics/claude-code-action@v1
        env:
          DEVFLOW_ISSUE_TOKEN: ${{ secrets.DEVFLOW_ISSUE_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: claude
          prompt: ${{ steps.impl_prompt.outputs.text }}
          claude_args: >-
            --model ${{ steps.decision.outputs.implement || steps.models.outputs.implement }}
            ${{ env.ARGS_IMPLEMENT_BASE }}

  # PR上の作業：CIの自動修正、セルフレビュー、レビュー対応、コメント対応、コンフリクト解消
  pr:
    needs: route
    if: needs.route.outputs.pr_action != ''
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        pr: ${{ fromJSON(needs.route.outputs.prs) }}
    concurrency:
      group: devflow-pr-${{ matrix.pr }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: read
      id-token: write
    env:
      CFG: ${{ needs.route.outputs.config }}
      MENTION: ${{ needs.route.outputs.mention }}
      REVIEWERS: ${{ needs.route.outputs.reviewers }}
      ACTION: ${{ needs.route.outputs.pr_action }}
      PR: ${{ matrix.pr }}
      COMMENT_ID: ${{ needs.route.outputs.comment_id }}
      REVIEW_ID: ${{ needs.route.outputs.review_id }}
      RUN_ID: ${{ needs.route.outputs.run_id }}
      DEVFLOW_REPO: ${{ inputs.devflow_repo }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: PRのブランチを取得
        id: head
        run: |
          echo "ref=$(gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json headRefName -q .headRefName)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.head.outputs.ref }}
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.devflow_repo }}
          ref: ${{ inputs.devflow_ref }}
          path: .devflow-src
          persist-credentials: false
      - name: 共通ワークフローの準備
        run: |
          mv .devflow-src "$RUNNER_TEMP/devflow"
          bash "$RUNNER_TEMP/devflow/scripts/env.sh"

      # CIの自動修正：Haikuがログを要約し、Sonnetが直す
      - name: CIの失敗ログを取得
        if: env.ACTION == 'ci_fix'
        run: |
          gh run view "$RUN_ID" --log-failed | tail -n 3000 > "$RUNNER_TEMP/ci-failed.log" || true
          echo "CI_LOG=$RUNNER_TEMP/ci-failed.log" >> "$GITHUB_ENV"
      - name: 要約のプロンプト
        id: summary_prompt
        if: env.ACTION == 'ci_fix'
        run: bash "$DEVFLOW_DIR/scripts/prompt.sh" ci_summary
      - name: CIログの要約
        id: summary
        if: env.ACTION == 'ci_fix'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: claude
          prompt: ${{ steps.summary_prompt.outputs.text }}
          claude_args: >-
            ${{ env.ARGS_LIGHT }}
            --json-schema '{"type":"object","properties":{"summary":{"type":"string"}},"required":["summary"]}'
      - name: 要約を渡す
        if: env.ACTION == 'ci_fix'
        env:
          RESULT: ${{ steps.summary.outputs.structured_output }}
        run: |
          printf '%s' "$RESULT" | jq -r '.summary // ""' > "$RUNNER_TEMP/ci-summary.md" || true
          echo "CI_SUMMARY_FILE=$RUNNER_TEMP/ci-summary.md" >> "$GITHUB_ENV"

      # セルフレビュー：Opusが1回だけレビューする
      - name: セルフレビューのプロンプト
        id: review_prompt
        if: env.ACTION == 'self_review'
        run: bash "$DEVFLOW_DIR/scripts/prompt.sh" self_review
      - name: セルフレビュー
        id: review
        if: env.ACTION == 'self_review'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: claude
          prompt: ${{ steps.review_prompt.outputs.text }}
          claude_args: >-
            ${{ env.ARGS_REVIEW }}
            --json-schema '{"type":"object","properties":{"has_findings":{"type":"boolean"},"review":{"type":"string"}},"required":["has_findings","review"]}'
      - name: セルフレビューを投稿
        id: review_result
        if: env.ACTION == 'self_review'
        env:
          RESULT: ${{ steps.review.outputs.structured_output }}
        run: |
          jq -r '"## セルフレビュー（Opus）\n\n" + .review + "\n\n<!-- devflow:self-review -->"' <<<"$RESULT" > "$RUNNER_TEMP/review.md"
          gh pr comment "$PR" --body-file "$RUNNER_TEMP/review.md"
          echo "has_findings=$(jq -r .has_findings <<<"$RESULT")" >> "$GITHUB_OUTPUT"
      - name: レビュー可能にする
        if: env.ACTION == 'self_review' && steps.review_result.outputs.has_findings == 'false'
        run: |
          gh pr ready "$PR"
          if [ -n "$REVIEWERS" ]; then gh pr edit "$PR" --add-reviewer "$REVIEWERS"; fi

      # [REVIEW REQUEST] で頼まれたレビュー：Opusがインラインコメントで返す。pushはしない
      - name: レビューのプロンプト
        id: request_prompt
        if: env.ACTION == 'review_request'
        run: bash "$DEVFLOW_DIR/scripts/prompt.sh" review_request
      - name: レビュー
        if: env.ACTION == 'review_request'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: claude
          prompt: ${{ steps.request_prompt.outputs.text }}
          claude_args: ${{ env.ARGS_REVIEW }}

      # Sonnetによる修正
      - name: 修正のプロンプト
        id: work_prompt
        if: env.ACTION != 'review_request' && (env.ACTION != 'self_review' || steps.review_result.outputs.has_findings == 'true')
        run: |
          name="$ACTION"
          if [ "$ACTION" = self_review ]; then name=self_review_fix; fi
          bash "$DEVFLOW_DIR/scripts/prompt.sh" "$name"
      - name: 修正
        if: steps.work_prompt.outcome == 'success'
        uses: anthropics/claude-code-action@v1
        env:
          DEVFLOW_ISSUE_TOKEN: ${{ secrets.DEVFLOW_ISSUE_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: claude
          prompt: ${{ steps.work_prompt.outputs.text }}
          claude_args: ${{ env.ARGS_IMPLEMENT }}

  # flaky testの起票：検出はroute、原因の分析はHaiku
  flaky:
    needs: route
    if: needs.route.outputs.flaky_run != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
      actions: read
      id-token: write
    env:
      CFG: ${{ needs.route.outputs.config }}
      MENTION: ${{ needs.route.outputs.mention }}
      RUN_ID: ${{ needs.route.outputs.flaky_run }}
      DEVFLOW_REPO: ${{ inputs.devflow_repo }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ fromJSON(needs.route.outputs.config).default_branch }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.devflow_repo }}
          ref: ${{ inputs.devflow_ref }}
          path: .devflow-src
          persist-credentials: false
      - name: 共通ワークフローの準備
        run: |
          mv .devflow-src "$RUNNER_TEMP/devflow"
          bash "$RUNNER_TEMP/devflow/scripts/env.sh"
      - name: 1回目の失敗ログを取得
        run: |
          gh run view "$RUN_ID" --attempt 1 --log-failed | tail -n 3000 > "$RUNNER_TEMP/ci-failed.log" || true
          echo "CI_LOG=$RUNNER_TEMP/ci-failed.log" >> "$GITHUB_ENV"
      - name: 分析のプロンプト
        id: flaky_prompt
        run: bash "$DEVFLOW_DIR/scripts/prompt.sh" flaky
      # 起票はClaudeが起票したIssueとして扱うため、Claude自身が flaky-issue.sh で行う
      # （actionのApp tokenは終了時に失効するので、後続のステップでは使えない）
      - name: 原因の分析と起票
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: claude
          prompt: ${{ steps.flaky_prompt.outputs.text }}
          claude_args: ${{ env.ARGS_LIGHT }}

  # Claudeのジョブが失敗したら承認者に知らせる（利用上限に達した場合など）
  notify:
    needs: [route, issue, pr, flaky]
    if: failure() && needs.route.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      MENTION: ${{ needs.route.outputs.mention }}
      TARGETS: ${{ needs.route.outputs.issues }} ${{ needs.route.outputs.prs }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - run: |
          body="$MENTION Claudeの実行が失敗しました。Maxの利用上限に達した可能性があります。上限が戻ったら、[ワークフローの実行]($RUN_URL) の「Re-run failed jobs」で再実行してください。

          <!-- devflow:failure -->"
          for n in $(jq -rn --argjson a "$(jq -cs 'add' <<<"$TARGETS")" '$a | unique | .[]'); do
            gh issue comment "$n" -R "$GITHUB_REPOSITORY" --body "$body"
          done
